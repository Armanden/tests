<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Water Wheel Simulation</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #eef;
    margin: 0;
  }
  canvas {
    background: linear-gradient(#cceeff, #66ccff);
    border: 4px solid #333;
  }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const wheel = {
    x: 300,
    y: 200,
    radius: 70,
    angle: 0,
    angularVelocity: 0,
    spokes: 8
};

let particles = [];

function spawnParticle() {
    particles.push({
        x: 150 + Math.random() * 10 - 5,
        y: 0,
        vx: Math.random() * 1 - 0.5,
        vy: 2 + Math.random() * 2
    });
}

function drawWheel() {
    // Draw outer circle
    ctx.strokeStyle = '#654321';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(wheel.x, wheel.y, wheel.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Draw spokes
    for(let i=0;i<wheel.spokes;i++){
        const a = wheel.angle + i * (Math.PI * 2 / wheel.spokes);
        const x1 = wheel.x + Math.cos(a) * (wheel.radius - 10);
        const y1 = wheel.y + Math.sin(a) * (wheel.radius - 10);
        const x2 = wheel.x + Math.cos(a) * wheel.radius;
        const y2 = wheel.y + Math.sin(a) * wheel.radius;
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
}

function drawParticles() {
    ctx.fillStyle = 'rgba(0,150,255,0.7)';
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    });
}

function updateParticles() {
    for(let i = particles.length - 1; i >= 0; i--){
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        // Check collision with wheel
        const dx = p.x - wheel.x;
        const dy = p.y - wheel.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist > wheel.radius - 10 && dist < wheel.radius + 5){
            // Simple torque
            const impactAngle = Math.atan2(dy, dx);
            const force = p.vy * 0.0005;
            wheel.angularVelocity += Math.cos(impactAngle) * force;
            particles.splice(i, 1); // remove particle
        } else if(p.y > canvas.height) {
            particles.splice(i,1);
        }
    }
}

function drawWaterStream() {
    ctx.fillStyle = 'rgba(0,120,255,0.7)';
    ctx.fillRect(140, 0, 20, 80);
}

function animate(){
    ctx.clearRect(0,0,canvas.width, canvas.height);

    // Spawn particles
    if(Math.random() < 0.4) spawnParticle();

    drawWaterStream();
    updateParticles();
    drawParticles();

    wheel.angularVelocity *= 0.99; // friction
    wheel.angle += wheel.angularVelocity;
    drawWheel();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
