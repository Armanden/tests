<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Lemonade</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 10s ease-in-out infinite;
    }

    .blob.one {
      background: #ff00c8;
      top: -100px;
      left: -100px;
    }

    .blob.two {
      background: #00d4ff;
      bottom: -120px;
      right: -80px;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(-30px) translateX(20px);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      padding: 50px;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #fff, #9ae6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      color: #d1d5db;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    button {
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      border: none;
      color: white;
      padding: 16px 28px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }

    .quote {
      margin-top: 30px;
      font-style: italic;
      color: #93c5fd;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="blob one"></div>
  <div class="blob two"></div>

  <div class="card">
    <h1>Midnight Lemonade</h1>

    <p>
      A completely random webpage floating somewhere between
      retro internet aesthetics and modern glassmorphism.
    </p>

    <button onclick="randomQuote()">
      Generate Weird Quote
    </button>

    <div class="quote" id="quote">
      Click the button for chaos.
    </div>
  </div>

  <script>
    const quotes = [
      "The toaster knows too much.",
      "Never trust a penguin with Wi-Fi.",
      "Your keyboard misses you.",
      "A potato dreamed this website into existence.",
      "The moon is just the sun at night shift.",
      "JavaScript was a mistake. Also a miracle.",
      "Somewhere, a duck is judging your CSS."
    ];

    function randomQuote() {
      const random = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById("quote").textContent = random;
    }
  </script>

</body>
</html>
